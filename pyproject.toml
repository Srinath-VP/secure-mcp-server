[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure-mcp-server"
version = "0.1.0"
description = "A security-first reference MCP server: per-agent JWT identity, least-privilege tools, tamper-evident audit logs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Srinath Palani" }]
dependencies = [
    "mcp>=2.0,<3",
    "pyjwt>=2.8",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
secure-mcp-server = "secure_mcp_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
